<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!--<a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">-->
    <a-scene mindar-image="imageTargetSrc: ./targets/offscore_landforms.mind; filterMinCF:0.001; filterBeta: 0;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <img id="landforms_cover" src="./targets/land-forms.jpg" />
        <img id="offscore_cover" src="./targets/offscore.png" />
        <!--<a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>-->
        
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="landforms" mindar-image-target="targetIndex: 1">
        <a-plane src="#landforms_cover" opacity="1" position="0 0 0.1" height="0.97656" width="1" rotation="0 0 0"></a-plane>
        <!--<a-plane color="green" opacity="0.5" position="0 -1 0.1" height="1" width="1" rotation="0 0 0"></a-plane>
        <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
        <a-gltf-model rotation="0 0 0 " position="0 0 0.1" scale="0.005 0.005 0.005" src="#avatarModel" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>-->
      </a-entity>
      <a-entity id="offscore" mindar-image-target="targetIndex: 0">
        <a-plane src="#offscore_cover" opacity="1" position="0 0 0.1" height="0.89285" width="1" rotation="0 0 0"></a-plane>
      </a-entity>
    </a-scene>

    <audio id="ridge-audio">
        <source src="./songs/02 Ridge.mp3" type="audio/mpeg">
    </audio>
    <audio id="cicada-audio">
        <source src="./songs/Yenting - Off-score - Cicada.mp3" type="audio/mpeg">
    </audio>

    <script>
        // detect target found
        const landformsEntity = document.querySelector('#landforms');
        const offscoreEntity = document.querySelector('#offscore');
        const ridge_audio = document.getElementById("ridge-audio");
        const cicada_audio = document.getElementById("cicada-audio");
        landformsEntity.addEventListener("targetFound", event => {
            ridge_audio.play();
        });
        landformsEntity.addEventListener("targetLost", event => {
            ridge_audio.pause();
        });
        offscoreEntity.addEventListener("targetFound", event => {
            cicada_audio.play();
        });
        offscoreEntity.addEventListener("targetLost", event => {
            cicada_audio.pause();
        });
    </script>
  </body>
</html>
