<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="libs/aframe.min.js"></script> <!-- https://aframe.io/releases/1.6.0/aframe.min.js -->
    <script src="libs/mindar-image-aframe.prod.js"></script> <!-- https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js -->

    <style>
      @font-face {
        font-family: transcity;
        src: url(fonts/transcity/Transcity\ DEMO.otf) format("opentype")
      }

      #info {
        position: absolute;
        top: 0;
        width: 100%;
        height: 10vh;
        background-image: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0));
      }

      #timeline {
        background-color: rgba(0,0,0,0.3);
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        margin: 10px 20px 10px 20px;
        height: calc(5vh - 30px);
        width: calc(100vw - 40px);
        border: 3px;
        border-color: rgba(255,255,255,0.5);
        border-style: solid;
        cursor: col-resize;
      }

      #song-title {
        margin: 15px;
        font-size: 3vh;
        font-family: transcity;
        color: white;

        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
      }

      #play-head {
        position: relative;
        background-color:  white;
        width: 10px;
        height: calc(100% + 6px + 10px);
        margin: -8px -5px -8px -5px;
        left: 0%;
      }
      .a-enter-vr-button {
        display: none;
      }
      .mindar-ui-overlay {
        pointer-events: none;
      }

      .fadeIn {
        opacity: 1;
        transition: opacity 1s linear;
      }

      .fadeOut {
        opacity: 0;
        transition: opacity 2s linear;
      }
    </style>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./targets/photos_postcards_targets_bnw.mind; filterMinCF:0.001; filterBeta: 0;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <img id="landforms_cover" src="./targets/gray_smallest_bnw.jpg" />
        <img id="offscore_cover" src="./targets/yellow_post_smaller_bnw.jpg" />
        <!--<a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>-->
        
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="landforms" mindar-image-target="targetIndex: 0">
        <a-plane src="#landforms_cover" opacity="1" position="0 0 0.1" height="0.97656" width="1" rotation="0 0 0"></a-plane>
        <!--<a-plane color="green" opacity="0.5" position="0 -1 0.1" height="1" width="1" rotation="0 0 0"></a-plane>
        <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
        <a-gltf-model rotation="0 0 0 " position="0 0 0.1" scale="0.005 0.005 0.005" src="#avatarModel" animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-gltf-model>-->
      </a-entity>
      <a-entity id="offscore" mindar-image-target="targetIndex: 1">
        <a-plane src="#offscore_cover" opacity="1" position="0 0 0.1" height="0.89285" width="1" rotation="0 0 0"></a-plane>
      </a-entity>
    </a-scene>

    <div id="info" class="fadeOut">
      <div id="song-title">
        YenTing Lo & Yoko Suziki - White Horse
      </div>
      <div id="timeline">
        <div id="play-head" draggable="true">

        </div>
      </div>
    </div>

    <audio id="ridge-audio">
        <source src="./songs/02 Ridge.mp3" type="audio/mpeg">
    </audio>
    <audio id="cicada-audio">
        <source src="./songs/Yenting - Off-score - Cicada.mp3" type="audio/mpeg">
    </audio>

    <script>
        var playhead = document.getElementById("play-head");
        playhead.style.left = "0%";
        var info = document.getElementById("info");
        var timeline = document.getElementById("timeline");

        function processClientPointer(clientX) {
          let wantedPlayhead = Math.max(0, Math.min((clientX - Math.abs(timeline.offsetLeft))/timeline.offsetWidth, 1.0));
          
          if (currentlyPlayingAudio != null) {
            currentlyPlayingAudio.currentTime = currentlyPlayingAudio.duration * wantedPlayhead;
            if (currentlyPlayingAudio.paused)
              currentlyPlayingAudio.play();
          }
        }

        info.addEventListener("pointerdown", function (ev) {
          //console.log("pointer down", ev);
          processClientPointer(ev.clientX);
        });
        info.addEventListener("pointermove", function (ev) {
          //console.log("pointer move", pointerIsDown, ev);
          let clicking = ev.buttons != 0;
          if (clicking)
            processClientPointer(ev.clientX);
        });
        info.addEventListener("pointerup", function (ev) {
          //console.log("pointer up", ev);
          pointerIsDown = false;
        });
        
        var songTitle = document.getElementById("song-title");

        var currentlyPlayingAudio = null;

        function onPlayheadDrag(event) {
          console.log(drag);
        }

        function OnTargetFound(audioPlayback, title)
        {
          if (audioPlayback == currentlyPlayingAudio) {
            if (currentlyPlayingAudio.paused) {
              currentlyPlayingAudio.currentTime = 0;
              currentlyPlayingAudio.play();
            }
            return;
          }
          if (currentlyPlayingAudio != null) {
            currentlyPlayingAudio.pause();
            currentlyPlayingAudio.currentTime = 0;
          }
          currentlyPlayingAudio = audioPlayback;
          audioPlayback.play();
          songTitle.innerText = title;
        }

        function registerSong(id, audioId, title) {
          document.getElementById(id).addEventListener("targetFound", event => {
              OnTargetFound(document.getElementById(audioId), title);
          });
          document.getElementById(id).addEventListener("targetLost", event => {
            
          });
        }

        // Songs registration
        registerSong("landforms", "cicada-audio", "YenTing Lo - Cicada & Banyan Tree");
        registerSong("offscore", "ridge-audio", "YenTing Lo - Ridge");

        let showingInfo = false;

        function animatePlayhead() {
          if (currentlyPlayingAudio != null) {
            let factor = currentlyPlayingAudio.currentTime / currentlyPlayingAudio.duration;
            factor *= 100.0;
            //factor = Math.round(factor);
            if (factor > 100) factor = 100;            
            playhead.style.left = factor+"%";

            if (!showingInfo && !currentlyPlayingAudio.paused) {
              info.classList.remove("fadeOut");
              info.classList.add("fadeIn");
              showingInfo = true;
            }
            else if (showingInfo && currentlyPlayingAudio.paused && factor >= 100) {
              info.classList.remove("fadeIn");
              info.classList.add("fadeOut");
              showingInfo = false;
            }
          }

          requestAnimationFrame(animatePlayhead);
        }
        requestAnimationFrame(animatePlayhead);
    </script>
  </body>
</html>
