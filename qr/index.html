    <style>
      @font-face {
        font-family: transcity;
        src: url(fonts/transcity/Transcity\ DEMO.otf) format("opentype")
      }

      #info {
        position: absolute;
        top: 0;
        width: 100%;
        height: 10vh;
        background-image: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0));
      }

      #play-dropdown {
        position: absolute;
        top: 0;
        width: 100%;
        height: 20vh;
        background-image: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0));
        pointer-events: none;
      }
      
      #tutorial {
        position: absolute;
        top: 0;
        width: 100%;
        height: 30vh;
        background-image: linear-gradient(to bottom, rgba(0,0,0,0.5), rgba(0,0,0,0));
      }

      #timeline {
        background-color: rgba(0,0,0,0.3);
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        margin: 10px 20px 10px 20px;
        height: 1.5vh;/*calc(5vh - 30px);*/
        width: calc(100vw - 40px);
        /*border: 3px;
        border-color: rgba(255,255,255,0.5);
        border-style: solid;*/
        cursor: col-resize;
      }

      #song-title {
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
      }

      .text-title {
        margin: 15px;
        font-size: 3vh;
        font-family: transcity;
        color: white;
        text-align: center;
      }

      #tutorial .text-title {
        font-size: 2.5vh;
        line-height: 4vh;
        margin-top: 30px;
      }

      #play-head {
        position: relative;
        background-color:  white;
        width: 10px;
        height: calc(100% + 6px + 10px);
        margin: -8px -5px -8px -5px;
        left: 0%;
      }
      .a-enter-vr-button {
        display: none;
      }
      .mindar-ui-overlay {
        pointer-events: none;
      }

      .fadeIn {
        opacity: 1;
        transition: opacity 1s linear;
      }

      .fadeOut {
        opacity: 0;
        transition: opacity 2s linear;
      }

      #start-div {
        pointer-events: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        top: 0;
        background: linear-gradient(45deg, #edc1b6, #69a3ae, #088695); /*#feebff*/
        animation: gradient 15s ease infinite;
        background-size: 400% 400%;
      }

      .start-text {
        pointer-events: none;
        text-align: center;
        
        position: relative;
        top: 50%;
        transform: translateY(-50%);
      }

      .nodisplay {
        display: none;
      }

      .mindar-ui-overlay {
        z-index: -1;
      }

      #play-button {
        margin-left: auto;
        margin-right: auto;
        margin-top: 10vh;
        margin-bottom: 15px;
        display: block;
        height: calc(10vh - 15px);
        pointer-events: none;
      }

      



      @keyframes gradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
    </style>
  </head>

    <script>
        // AR loading
        
        let startDiv = document.getElementById("start-div");
        let startArText = document.getElementById("start-ar-text");
        let startAudioText = document.getElementById("start-audio-text");
        let arSystem;
        let startedAR = false;
        let startedAudio = false;
        let firstScan = true;
        let startupAudio = document.getElementById("startup-audio");


        async function tryPlayAudio(audio) {
          await audio.play()
          .then(() => {
            playDropdown.classList.add("fadeOut");
            playDropdown.classList.remove("fadeIn");
            // playDropdown.classList.remove("fadeOut");
            // playDropdown.classList.add("fadeIn");
          })
          .catch(error => {
            playDropdown.classList.remove("fadeOut");
            playDropdown.classList.add("fadeIn");
          });
        }

        function startEverything() {
          if (!startedAR)
          {
            arSystem.start();
            startedAR = true;
            startArText.classList.add("fadeOut");
            startAudioText.classList.remove("fadeOut");
            startAudioText.classList.add("fadeIn");

            // let scanners = document.getElementsByClassName("mindar-ui-scanning")[0];
            // for (let i = 0; i < scanners.length; ++i) {
            //   scanners[i].style.removeProperty("z-index");
            //   scanners[i].style.zIndex = -1;
            // }
          }
          else if (!startedAudio)
          {
            startupAudio.play();
            startedAudio = true;
            startDiv.classList.add("fadeOut");
          }
          else if (startedAudio && startedAR) {
            if (currentlyPlayingAudio != null && currentlyPlayingAudio.paused)
            {
              tryPlayAudio(currentlyPlayingAudio);
            }
          }
        }

        document.addEventListener("DOMContentLoaded", function() {
	          const sceneEl = document.querySelector('a-scene');
            sceneEl.addEventListener('loaded', function () {
              arSystem = sceneEl.systems["mindar-image-system"];

              let canvas = document.querySelector('canvas');
              canvas.addEventListener("pointerdown", startEverything);
            });
        });

        //
        var playhead = document.getElementById("play-head");
        playhead.style.left = "0%";
        var info = document.getElementById("info");
        var timeline = document.getElementById("timeline");
        var tutorial = document.getElementById("tutorial");

        function processClientPointer(clientX) {
          let wantedPlayhead = Math.max(0, Math.min((clientX - Math.abs(timeline.offsetLeft))/timeline.offsetWidth, 1.0));
          
          if (currentlyPlayingAudio != null) {
            currentlyPlayingAudio.currentTime = currentlyPlayingAudio.duration * wantedPlayhead;
            if (currentlyPlayingAudio.paused)
              currentlyPlayingAudio.play();
          }
        }

        info.addEventListener("pointerdown", function (ev) {
          //console.log("pointer down", ev);
          processClientPointer(ev.clientX);
        });
        info.addEventListener("pointermove", function (ev) {
          //console.log("pointer move", pointerIsDown, ev);
          let clicking = ev.buttons != 0;
          if (clicking)
            processClientPointer(ev.clientX);
        });
        info.addEventListener("pointerup", function (ev) {
          //console.log("pointer up", ev);
          pointerIsDown = false;
        });
        
        var songTitle = document.getElementById("song-title");

        var currentlyPlayingAudio = null;

        function onPlayheadDrag(event) {
          console.log(drag);
        }

        let playDropdown = document.getElementById("play-dropdown");

        // function tryPlayAudio(audio) {
        //   try {
        //     audio.play();
        //     playDropdown.classList.remove("fadeIn");
        //     playDropdown.classList.add("fadeOut");
        //   }
        //   catch (error) {
        //     playDropdown.classList.remove("fadeOut");
        //     playDropdown.classList.add("fadeIn");
        //   }
        // }

        function OnTargetFound(audioPlayback, title)
        {
          if (firstScan) {
            firstScan = false;
            startDiv.classList.add("nodisplay");
          }

          if (audioPlayback == currentlyPlayingAudio) {
            if (currentlyPlayingAudio.paused) {
              currentlyPlayingAudio.currentTime = 0;
              tryPlayAudio(currentlyPlayingAudio);
            }
            return;
          }
          if (currentlyPlayingAudio != null) {
            currentlyPlayingAudio.pause();
            currentlyPlayingAudio.currentTime = 0;
          }
          currentlyPlayingAudio = audioPlayback;
          tryPlayAudio(audioPlayback);
          songTitle.innerText = title;
        }

        function registerSong(id, audioId, title) {
          document.getElementById(id).addEventListener("targetFound", event => {
              OnTargetFound(document.getElementById(audioId), title);
          });
          document.getElementById(id).addEventListener("targetLost", event => {
            
          });
        }

        var albumSongTitles = [
          "A Winter Song",
          "The Forest",
          "White Horse Past Morning",
          "Today's My Day",
          "Dunes",
          "Tunnelbanan",
          "Paths Intertwined",
          "冬の歌 fuyu no uta"
        ];

        function registerAlbumSong(it) {
          let id = ""+(it + 1);
          registerSong("entity0"+id, "song0"+id, albumSongTitles[it]);
        }

        // Songs registration
        for (let i = 0; i < 8; ++i) {
          //if (i == 1) continue; // We have no forest song
          registerAlbumSong(i);
        }

        let showingInfo = false;

        function animatePlayhead() {
          if (currentlyPlayingAudio != null) {
            let factor = currentlyPlayingAudio.currentTime / currentlyPlayingAudio.duration;
            factor *= 100.0;
            //factor = Math.round(factor);
            if (factor > 100) factor = 100;            
            playhead.style.left = factor+"%";

            if (!showingInfo && !currentlyPlayingAudio.paused) {
              info.classList.remove("fadeOut");
              info.classList.add("fadeIn");
              showingInfo = true;
              tutorial.classList.remove("fadeIn");
              tutorial.classList.add("fadeOut");
            }
            else if (showingInfo && currentlyPlayingAudio.paused && factor >= 100) {
              info.classList.remove("fadeIn");
              info.classList.add("fadeOut");
              tutorial.classList.remove("fadeOut");
              tutorial.classList.add("fadeIn");
              showingInfo = false;
              playDropdown.classList.add("fadeOut");
            }
          }

          requestAnimationFrame(animatePlayhead);
        }
        requestAnimationFrame(animatePlayhead);

        // Debug
        //OnTargetFound(document.getElementById("song08"), albumSongTitles[7]);
    </script>
